<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Security Lock - {{ bot_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: rgba(255, 255, 255, 0.08);
      --text-hi: #ffffff;
      --text-mid: #a1a1aa;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-hi);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .glow-orb {
      position: absolute; width: 450px; height: 450px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
    }
    .lock-card {
      position: relative; z-index: 10; width: 100%; max-width: 440px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 24px; padding: 2.5rem; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lock-icon-wrap {
      width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 20px;
      background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .lock-icon-wrap svg { width: 34px; height: 34px; stroke: var(--accent); }
    .card-title {
      font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800;
      color: #ffffff; letter-spacing: -0.02em; margin-bottom: 0.5rem;
    }
    .card-subtitle {
      font-size: 0.88rem; color: var(--text-mid); line-height: 1.5; margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-label {
      display: block; font-size: 0.75rem; font-weight: 700; color: #d4d4d8;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem;
    }
    .input-wrap { position: relative; }
    .pin-input {
      width: 100%; background: #18181b; border: 1px solid var(--border);
      border-radius: 14px; padding: 0.9rem 1.1rem; font-family: monospace, sans-serif;
      font-size: 1.25rem; font-weight: 700; color: #ffffff; letter-spacing: 0.2em;
      text-align: center; transition: all 0.2s ease; outline: none;
    }
    .pin-input:focus {
      border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .unlock-btn {
      width: 100%; background: var(--accent); color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 700;
      padding: 0.95rem; border: none; border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      transition: all 0.2s ease; box-shadow: 0 8px 20px -4px var(--accent-glow);
    }
    .unlock-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .unlock-btn:active { transform: translateY(0); }
    .alert-banner {
      display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; font-size: 0.85rem; font-weight: 600; padding: 0.75rem 1rem;
      border-radius: 12px; margin-bottom: 1.25rem; text-align: center;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.35s ease-in-out; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb"></div>

  <div class="lock-card" id="lockCard">
    <div class="lock-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1 class="card-title">Admin Security Lock</h1>
    <p class="card-subtitle">This dashboard panel is protected. Enter your 6-digit Owner Security PIN to unlock cluster telemetry and admin controls.</p>

    <div class="alert-banner" id="errorAlert">Invalid Admin PIN. Please try again.</div>

    <form id="pinForm">
      <div class="form-group">
        <label class="form-label" for="pinInput">Owner Passcode / PIN</label>
        <div class="input-wrap">
          <input type="password" id="pinInput" class="pin-input" placeholder="••••••" maxlength="12" autocomplete="off" autofocus required>
        </div>
      </div>
      <button type="submit" class="unlock-btn" id="submitBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Unlock Admin Panel
      </button>
    </form>
  </div>

  <script>
    const pinForm = document.getElementById('pinForm');
    const pinInput = document.getElementById('pinInput');
    const lockCard = document.getElementById('lockCard');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    pinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = pinInput.value.trim();
      if (!pin) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying PIN...';
      errorAlert.style.display = 'none';

      try {
        const resp = await fetch('/api/admin/verify-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        });
        const data = await resp.json();

        if (resp.ok && data.success) {
          window.location.reload();
        } else {
          showError(data.message || 'Invalid PIN. Try again.');
        }
      } catch (err) {
        showError('Network error while verifying PIN.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock Admin Panel`;
      }
    });

    function showError(msg) {
      errorAlert.innerText = msg;
      errorAlert.style.display = 'block';
      lockCard.classList.remove('shake');
      void lockCard.offsetWidth; // trigger reflow
      lockCard.classList.add('shake');
      pinInput.value = '';
      pinInput.focus();
    }
  </script>
</body>
</html>
